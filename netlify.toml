# Netlify가 site/ 폴더만 공개합니다. (CLAUDE.md 등 문서는 공개되지 않음)
[build]
  publish = "site"
  command = ""
  # site/ 가 안 바뀐 push(문서만 수정 등)는 배포를 건너뜀 → 크레딧(배포 1회 15) 절약
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"

# 캐시: HTML은 항상 최신, 이미지/아이콘은 1주일
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
